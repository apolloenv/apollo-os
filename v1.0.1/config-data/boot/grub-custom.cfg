# Apollo OS - Custom GRUB Configuration
# This file can be placed in /etc/grub.d/40_custom

# Custom boot entry with Apollo OS branding
menuentry 'Apollo OS (Fedora Linux)' --class fedora --class gnu-linux --class gnu --class os {
    load_video
    set gfxpayload=keep
    insmod gzio
    insmod part_gpt
    insmod ext2

    # Terminal output
    terminal_output console

    # Load kernel (adjust paths as needed)
    linux /vmlinuz root=UUID=YOUR-ROOT-UUID ro systemd.show_status=true
    initrd /initramfs.img
}
