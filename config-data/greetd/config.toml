# Apollo OS - greetd Configuration
# Terminal-based Login Manager with Session Selection

[terminal]
vt = 1

[default_session]
# tuigreet with Apollo OS branding and session dropdown
command = "tuigreet --time --time-format \"%H:%M:%S\" --remember --remember-session --asterisks --sessions /usr/share/wayland-sessions --greeting \"APOLLO OS v0.4.1\""
user = "greeter"
