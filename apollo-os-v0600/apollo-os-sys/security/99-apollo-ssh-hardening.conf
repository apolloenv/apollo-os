# Apollo OS - SSH Hardening Configuration
# Deployed to: /etc/ssh/sshd_config.d/99-apollo-hardening.conf
# Uses drop-in directory to avoid overwriting system defaults

# Disable root login
PermitRootLogin no

# Disable password authentication (key-based only)
# Note: Uncomment after setting up SSH keys
# PasswordAuthentication no

# Limit authentication attempts
MaxAuthTries 3
MaxSessions 3
LoginGraceTime 30

# Disable empty passwords
PermitEmptyPasswords no

# Disable X11 forwarding (security risk)
X11Forwarding no

# Disable TCP forwarding unless explicitly needed
AllowTcpForwarding no
AllowAgentForwarding no

# Use only strong ciphers and MACs
Ciphers aes256-gcm@openssh.com,chacha20-poly1305@openssh.com,aes256-ctr
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com
KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512

# Log more details for audit
LogLevel VERBOSE

# Disconnect idle sessions after 10 minutes
ClientAliveInterval 300
ClientAliveCountMax 2

# Protocol 2 is the only supported protocol since OpenSSH 7.6+
# No explicit Protocol directive needed
