# Apollo OS — DNS-over-TLS Configuration
# Deployed to: /etc/systemd/resolved.conf.d/99-apollo-dns-tls.conf
# Encrypts all DNS queries to prevent DNS sniffing/manipulation

[Resolve]
DNS=1.1.1.1#cloudflare-dns.com 1.0.0.1#cloudflare-dns.com 9.9.9.9#dns.quad9.net
FallbackDNS=8.8.8.8#dns.google 8.8.4.4#dns.google
DNSOverTLS=opportunistic
DNSSEC=allow-downgrade
Cache=yes
CacheFromLocalhost=no
