# Apollo OS — WiFi MAC Address Randomization
# Deployed to: /etc/NetworkManager/conf.d/99-apollo-mac-random.conf
# Randomizes MAC address on WiFi connections to prevent tracking
# Note: Ethernet is NOT randomized to avoid DHCP/corporate network issues

[device]
wifi.scan-rand-mac-address=yes

[connection]
wifi.cloned-mac-address=random
ethernet.cloned-mac-address=preserve
